name: upstream-check

# 每周检查一次上游是否发了新版本；有的话开一个 issue（不自动改代码，合并由人工确认）。
on:
  schedule:
    - cron: '0 1 * * 1'      # 每周一 01:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 对比上游最新 release
        id: up
        run: |
          LATEST=$(curl -fsSL https://api.github.com/repos/xfangfang/wiliwili/releases/latest | jq -r '.tag_name')
          CUR=$(tr -d '[:space:]' < VERSION)
          echo "latest=$LATEST"  >> "$GITHUB_OUTPUT"
          echo "current=$CUR"    >> "$GITHUB_OUTPUT"
          echo "上游最新=$LATEST 当前=$CUR"

      - name: 有新版本则开 issue
        if: steps.up.outputs.latest != steps.up.outputs.current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="上游更新：${{ steps.up.outputs.latest }}（当前 ${{ steps.up.outputs.current }}）"
          EXIST=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')
          BODY=$(cat <<EOF
          上游发新版本了：\`${{ steps.up.outputs.latest }}\`（当前合并到 \`${{ steps.up.outputs.current }}\`）。

          合并步骤：
          1. \`scripts/merge-upstream.sh ${{ steps.up.outputs.latest }}\`（检查补丁能否干净打上）
          2. 更新 \`VERSION\`
          3. 在 \`MERGE_LOG.md\` 追加一条合并记录
          4. 打 tag \`${{ steps.up.outputs.latest }}\` 推送，触发 build-port 出包
          5. 上机复测（H700），把结果写进这条记录

          compare: https://github.com/xfangfang/wiliwili/compare/${{ steps.up.outputs.current }}...${{ steps.up.outputs.latest }}
          EOF
          )
          if [ -n "$EXIST" ]; then
            echo "已存在 issue #$EXIST，跳过"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi