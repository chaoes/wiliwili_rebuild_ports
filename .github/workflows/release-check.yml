name: release-check

# 每周核对一次：仓库里的 VERSION 与最新 Release 是否一致（忘记发版 / 忘记改版本号都能发现）。
# 不一致就开 issue，不改代码、不自动发版。
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 比对 VERSION 与最新 Release
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/release_check.py

      - name: 不一致时开 issue
        if: steps.v.outputs.state != 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          title=$(cat /tmp/release_check/title.txt)
          exist=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$exist" ]; then
            echo "已存在 issue #$exist，跳过"
          else
            gh issue create --title "$title" --body-file /tmp/release_check/body.md
          fi
